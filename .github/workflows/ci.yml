# Continuous integration (audit G4): enforce the two gates AGENTS.md documents,
# on every push and pull request.
#
# The suite is self-contained and needs nothing from CI beyond Python, git and
# bash:
#   * agy is replaced by tests/fake_agy/agy (no real binary, no account);
#   * conftest.py points HOME/XDG_STATE_HOME/AGY_MCP_STATE_DIR at temp dirs, and
#     the installer tests set HOME per test (no operator state is read);
#   * git identity is supplied by tests/helpers/make_repo.py, so no global
#     `git config user.*` is required;
#   * cases that only make sense as root already carry skipif(geteuid() == 0)
#     or a non-root branch, so they are not weakened here.
# No secrets are needed; the only network use is installing the project's
# declared dev extras.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Publish hygiene
        run: python scripts/check_publishable.py
      - name: Docs check
        run: python scripts/check_docs.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.12": test the supported
        # floor and the interpreter the project is developed on.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q --durations=30
